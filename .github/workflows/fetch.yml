name: fetch-blocks

on:
  workflow_dispatch:
    inputs:
      first_block:
        description: "First block / checkpoint / height"
        required: true
        type: number
      block_count:
        description: "Number of blocks (max 100)"
        required: true
        type: number
        default: 1

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch chunks and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first_block }}
          COUNT: ${{ inputs.block_count }}
        run: |
          set -euo pipefail
          python3 -c 'import os,sys; f=int(float(os.environ["FIRST"])); c=int(float(os.environ["COUNT"])); sys.exit(0 if f>=0 and 1<=c<=100 else 1)'
          f="$FIRST"
          l=$((FIRST + COUNT - 1))
          python3 scripts/fetch_chunk.py --first "$f" --count "$COUNT"
          TAG="cardano-${f}-${l}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "cardano ${f}-${l}" \
              --notes "cardano public block data. Raw JSON gzipped. Manifest: first/last/block_count/tx_count/bytes/sha256. No private keys."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "cardano_${f}_${l}.json.gz" "cardano_${f}_${l}.manifest.json"
